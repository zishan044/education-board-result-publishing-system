services:
  postgres:
      image: postgres:18.6-alpine3.24
      container_name: ebrps_postgres
      restart: unless-stopped
      environment:
        POSTGRES_USER: ${POSTGRES_USER:-results}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB:-results}
      ports:
        - "5432:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-results} -d ${POSTGRES_DB:-results}"]
        interval: 5s
        timeout: 3s
        retries: 10
      networks:
        - ebrps

  valkey:
    image: valkey/valkey:9.0-alpine3.24
    container_name: ebrps_valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ebrps
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ebrps-api:latest
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-results}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-results}?sslmode=disable
      VALKEY_ADDR: valkey:6379
      HTTP_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - ebrps
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: ebrps_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - ebrps

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: ebrps_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - ebrps

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: ebrps_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-results}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-results}?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - ebrps

  redis_exporter:
    image: oliver006/redis_exporter:v1.67.0-alpine
    container_name: ebrps_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "valkey:6379"
    depends_on:
      - valkey
    networks:
      - ebrps

  nginx:
    image: nginx:1.31.6-alpine
    container_name: ebrps_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - pdf_data:/usr/share/nginx/pdfs
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - ebrps

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: ebrps_nginx_exporter
    restart: unless-stopped
    command:
      - "--nginx.scrape-uri=http://nginx:8081/stub_status"
    depends_on:
      - nginx
    networks:
      - ebrps
  
  volumes:
    pgdata:
    valkeydata:
    pdf_data:
    prometheus_data:
    grafana_data: