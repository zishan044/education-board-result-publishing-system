worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=5r/s;
    limit_req_status 429;

    proxy_cache_path /var/cache/nginx/stats levels=1:2 keys_zone=stats_cache:20m
                     max_size=200m inactive=10m use_temp_path=off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        location = /healthz {
            set $upstream api;
            proxy_pass http://$upstream:8080/healthz;
        }

        location /api/v1/results {
            limit_req zone=per_ip burst=20 nodelay;
            set $upstream api;
            proxy_pass http://$upstream:8080$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /api/v1/stats {
            limit_req zone=per_ip burst=20 nodelay;
            proxy_cache stats_cache;
            proxy_cache_key "$request_uri";
            proxy_cache_valid 200 10m;
            proxy_cache_valid 404 30s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
            add_header X-Cache-Status $upstream_cache_status always;
            set $upstream api;
            proxy_pass http://$upstream:8080$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /marksheets/ {
            alias /usr/share/nginx/pdfs/;
            try_files $uri @generate_pdf;
            add_header Cache-Control "public, max-age=31536000, immutable";
            limit_req zone=per_ip burst=30 nodelay;
        }

        location @generate_pdf {
            internal;
            set $upstream api;
            rewrite ^/marksheets/(.*)$ /internal/generate-pdf/$1 break;
            proxy_pass http://$upstream:8080;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }

        location /results/ {
            alias /usr/share/nginx/site/results/;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            limit_req zone=per_ip burst=30 nodelay;
        }

        location / {
            root /usr/share/nginx/site;
            try_files $uri $uri/ /index.html;
            limit_req zone=per_ip burst=20 nodelay;
        }
    }

    server {
        listen 8081;
        server_name _;
        location /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;
        }
    }
}
